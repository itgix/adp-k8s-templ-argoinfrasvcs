kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ gitops_destination_repo }}
    targetRevision: HEAD
    path: helm/argo-cd
    helm:
      valueFiles:
      - values.yaml
{% if gcp_shared_gateway_enabled %}
      - values/{{ environment }}/{{ region }}/values.generated.yaml
      - values/{{ environment }}/{{ region }}/values.yaml
{% endif %}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
