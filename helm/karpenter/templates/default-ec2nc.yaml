{{- if .Values.configuration.enabled }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: {{ .Values.configuration.amiFamily }}
  amiSelectorTerms:
    - alias: bottlerocket@latest
  {{- if .Values.configuration.blockDeviceMappings.overrideDefaultConfig }}
  blockDeviceMappings:
    - deviceName: {{ .Values.configuration.blockDeviceMappings.deviceName | default "/dev/xvdb" }}
      ebs:
        volumeSize: {{ .Values.configuration.blockDeviceMappings.volumeSize | default "20Gi" }}
        volumeType: {{ .Values.configuration.blockDeviceMappings.volumeType | default "gp3" }}
        encrypted: true
        deleteOnTermination: true
  {{- end }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  role: {{ .Values.configuration.nodeRole }}
  securityGroupSelectorTerms:
  {{- range .Values.configuration.securityGroupIDs }}
  - id: {{ . }}
  {{- end }}
  {{- range .Values.configuration.securityGroupNames }}
  - name: {{ . }}
  {{- end }}
  subnetSelectorTerms:
  {{- range .Values.configuration.subnetIDs }}
  - id: {{ . }}
  {{- end }}
  {{- if .Values.configuration.tags }}
  tags:
    {{- toYaml .Values.configuration.tags | nindent 4 }}
  {{- end }}
{{- end }}
