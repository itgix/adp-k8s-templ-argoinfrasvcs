{{- $infraServices := index .Values "infra-services" -}}
{{- $cloud := default "aws" (index $infraServices "cloud") -}}
{{- $workloadIdentityAccounts := default dict (index $infraServices "workload_identity_service_accounts") -}}
{{- $externalSecretsAccount := default dict (index $workloadIdentityAccounts "external-secrets") -}}
{{- $externalSecretsKsaName := default "external-secrets-operator-sa" (index $externalSecretsAccount "ksa_name") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
{{ if eq $cloud "gcp" }}
    iam.gke.io/gcp-service-account: {{ required "external_secrets_service_account_email is required for GCP external-secrets" (index $infraServices "external_secrets_service_account_email") | quote }}
{{ else }}
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ index .Values "infra-services" "aws_account_id" }}:role/{{ index .Values "infra-services" "eks_cluster_name" }}-secrets-operator
{{ end }}
  name: {{ ternary $externalSecretsKsaName "external-secrets-operator-sa" (eq $cloud "gcp") | quote }}
  namespace: external-secrets-operator
