{{- $infraServices := index .Values "infra-services" -}}
{{- $cloud := default "aws" (index $infraServices "cloud") -}}
{{- $workloadIdentityAccounts := default dict (index $infraServices "workload_identity_service_accounts") -}}
{{- $externalSecretsAccount := default dict (index $workloadIdentityAccounts "external-secrets") -}}
{{- $externalSecretsKsaName := default "external-secrets-operator-sa" (index $externalSecretsAccount "ksa_name") -}}
{{- $annotations := dict -}}
{{- if eq $cloud "gcp" -}}
{{- $_ := set $annotations "iam.gke.io/gcp-service-account" (required "external_secrets_service_account_email is required for GCP external-secrets" (index $infraServices "external_secrets_service_account_email")) -}}
{{- else -}}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" (printf "arn:aws:iam::%v:role/%v-secrets-operator" (index $infraServices "aws_account_id") (index $infraServices "eks_cluster_name")) -}}
{{- end -}}
{{- $annotations = mergeOverwrite
      $annotations
      (default dict (index $infraServices "service_account_annotations"))
      (default dict (index $infraServices (printf "%s_service_account_annotations" $cloud)))
      (default dict (index $infraServices "external_secrets_service_account_annotations"))
-}}
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
{{ toYaml $annotations | nindent 4 }}
  name: {{ ternary $externalSecretsKsaName "external-secrets-operator-sa" (eq $cloud "gcp") | quote }}
  namespace: external-secrets-operator
