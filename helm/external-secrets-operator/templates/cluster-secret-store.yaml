{{- $infraServices := index .Values "infra-services" -}}
{{- $cloud := default "aws" (index $infraServices "cloud") -}}
{{- $workloadIdentityAccounts := default dict (index $infraServices "workload_identity_service_accounts") -}}
{{- $externalSecretsAccount := default dict (index $workloadIdentityAccounts "external-secrets") -}}
{{- $externalSecretsKsaName := default "external-secrets-operator-sa" (index $externalSecretsAccount "ksa_name") -}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ ternary "secretstore-gcp" "secretstore-aws" (eq $cloud "gcp") }}
  namespace: external-secrets-operator
spec:
  provider:
{{ if eq $cloud "gcp" }}
    gcpsm:
      projectID: {{ required "gcp_project_id is required for the GCP ClusterSecretStore" (index $infraServices "gcp_project_id") | quote }}
      auth:
        workloadIdentity:
          clusterProjectID: {{ index $infraServices "gcp_project_id" | quote }}
          clusterLocation: {{ required "gke_location is required for the GCP ClusterSecretStore" (index $infraServices "gke_location") | quote }}
          clusterName: {{ required "gke_cluster_name is required for the GCP ClusterSecretStore" (index $infraServices "gke_cluster_name") | quote }}
          serviceAccountRef:
            name: {{ $externalSecretsKsaName | quote }}
            namespace: external-secrets-operator
{{ else }}
    aws:
      service: SecretsManager
      region: {{ index .Values "infra-services" "region" }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-operator-sa
            namespace: external-secrets-operator
{{ end }}
