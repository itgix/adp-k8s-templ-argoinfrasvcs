devlake:
  grafana:
    enabled: false
    external:
      url: "http://grafana.monitoring.svc.cluster.local"
  lake:
    encryptionSecret:
      secret: "PLACEHOLDER_MANAGED_BY_EXTERNAL_SECRETS"
      autoCreateSecret: false
      secretName: devlake-encryption-secret
  ingress:
    enabled: true
    enableHttps: false
    className: ""
    annotations: {}
    prefix: /
    httpPort: 80
    httpsPort: 443
