kyverno:
  reportsController:
    resources:
      limits:
        memory: "256Mi"
        cpu: 600m
      requests:
        cpu: 200m
        memory: "256Mi"
  backgroundController:
    resources:
      requests:
        cpu: "50m"
        memory: "124Mi"
      limits:
        cpu: "100m"
        memory: "124Mi"
  admissionController:
    resources:
      limits:
        memory: "256Mi"
        cpu: 600m
      requests:
        cpu: 200m
        memory: "256Mi"
  priorityClassName: "system-cluster-critical"
  replicaCount: 3
  cleanupController:
    enabled: false
  namespaceOverride: kyverno
  crds:
    install: true
    migration:
      enabled: false
  features:
    logging:
      format: json
      verbosity: -1
    forceFailurePolicyIgnore:
      enabled: true
  metricsService:
    create: false
  config:
    excludeKyvernoNamespace: true
    webhooks:
      namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
          - kube-system
          - kube-public
          - kube-node-lease
        - key: gardener.cloud/purpose
          operator: NotIn
          values:
          - kube-system
    excludeGroups:
    - system:nodes
    - system:serviceaccounts:kube-system
    excludeUsernames:
    - gardener.cloud:system:*
    - system:serviceaccount:kube-system:*
