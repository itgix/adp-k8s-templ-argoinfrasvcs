apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "albc.fullname" . }}-cloud-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "albc.labels" . | nindent 4 }}
data:
  cloud.yaml: |
    global:
      region: {{ .Values.cloudConfig.region }}
      projectId: {{ .Values.cloudConfig.projectId }}
    applicationLoadBalancer:
      networkId: {{ .Values.cloudConfig.networkId }}
