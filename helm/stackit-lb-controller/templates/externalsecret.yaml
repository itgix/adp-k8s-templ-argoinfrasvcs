apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "albc.fullname" . }}-cloud-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "albc.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secretstore-stackit
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cloudSecret.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: sa_key.json
      remoteRef:
        key: alb-controller-sa-key
