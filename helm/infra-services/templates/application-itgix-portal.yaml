{{- $infra := index .Values "infra-services" -}}
{{- if and (eq (default "aws" $infra.cloud) "gcp") $infra.itgix_portal_enabled (empty $infra.applications_template_repo) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-applications
  namespace: argocd
spec:
  project: infra
  sources:
    - repoURL: https://github.com/itgix/adp-k8s-templ-argoappsdemo.git
      targetRevision: {{ default "main" $infra.applications_template_repo_branch | quote }}
      path: helm/applications
      helm:
        valueFiles:
          - $values/helm/infra-services/values/{{ $infra.environment }}/{{ $infra.region }}/infra-facts.yaml
    - repoURL: {{ $infra.gitops_destination_repo | quote }}
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  revisionHistoryLimit: 3
{{- end }}
