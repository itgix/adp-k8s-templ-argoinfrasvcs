{{- if index .Values "infra-services" "adp_devops_agent_enabled" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adp-devops-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: {{ index .Values "infra-services" "gitops_destination_repo" }}
    targetRevision: HEAD
    path: helm/adp-devops-agent
    helm:
      valueFiles:
        - ../adp-devops-agent/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/values.yaml
        - ../infra-services/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/infra-facts.yaml
      values: |
{{- with (index .Values "infra-services" "applications_destination_repo") }}
        gitLabSettings:
          GITOPS_REPO_URL: {{ . | quote }}
          GITLAB_URL: {{ printf "%s://%s" (urlParse .).scheme (urlParse .).host | quote }}
{{- end }}
        infraContext:
          INFRA_GITOPS_REPO_URL: {{ index .Values "infra-services" "gitops_destination_repo" | quote }}
          INFRA_GITOPS_REVISION: {{ default "HEAD" (index .Values "infra-services" "default_policies_branch") | quote }}
        env:
        - name: QDRANT_URL
          value: "http://qdrant-vectordb.qdrant:6333/"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: adp-devops-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
{{- end }}