{{- if index .Values "infra-services" "enable_devlake" }}
{{- $infraServices := index .Values "infra-services" }}
{{- $prefix := printf "%s-%s-%s" (index $infraServices "region_short") (index $infraServices "environment") (index $infraServices "project_name") }}
{{- $devlakeIngressHost := index $infraServices "devlake_ingress_host" | default (printf "%s-%s-devlake-%s.%s" (index $infraServices "project_name") (index $infraServices "region") (index $infraServices "environment") (index $infraServices "dns_main_domain")) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devlake
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: {{ index .Values "infra-services" "gitops_destination_repo" }}
    targetRevision:  {{ default "HEAD" (index .Values "infra-services" "devlake_branch") }}
    path: helm/devlake
    helm:
      valueFiles:
        - ../devlake/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/values.yaml
        - ../infra-services/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/infra-facts.yaml
      values: |
        devlake:
          ingress:
            className: {{ include "infra-services.ingressClassName" (dict "infraServices" $infraServices "app" "devlake") }}
            annotations:
{{ include "infra-services.ingressAnnotations" (dict "infraServices" $infraServices "app" "devlake" "host" $devlakeIngressHost "managedCertificateName" "devlake" "frontendConfigName" "devlake") | nindent 14 }}
            hostname: {{ $devlakeIngressHost }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devlake
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
  revisionHistoryLimit: 3
{{- end }}
