{{- $infraServices := index .Values "infra-services" -}}
{{- $cloud := default "aws" (index $infraServices "cloud") -}}
{{- $workloadIdentityAccounts := default dict (index $infraServices "workload_identity_service_accounts") -}}
{{- $externalDnsAccount := default dict (index $workloadIdentityAccounts "external-dns") -}}
{{- $externalDnsKsaName := default "external-dns-sa" (index $externalDnsAccount "ksa_name") -}}
{{- if index $infraServices "external_dns_enabled" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: {{ index .Values "infra-services" "gitops_destination_repo" }}
    targetRevision:  {{ default (default "HEAD" (index .Values "infra-services" "gitops_destination_repo_branch")) (index .Values "infra-services" "external_dns_branch") }}
    path: helm/external-dns
    helm:
      valueFiles:
        - ../external-dns/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/values.yaml
        - ../infra-services/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/infra-facts.yaml
      values: |
        external-dns:
          provider:
            name: {{ ternary "google" "aws" (eq $cloud "gcp") }}
{{ if eq $cloud "gcp" }}
          extraArgs:
            google-project: {{ required "gcp_project_id is required for GCP external-dns" (index $infraServices "gcp_project_id") | quote }}
{{ end }}
          domainFilters:
            - {{ index .Values "infra-services" "dns_main_domain" }}
{{- with index .Values "infra-services" "external_dns_extra_domain" }}
            - {{ . }}
{{- end }}
          serviceAccount:
            name: {{ ternary $externalDnsKsaName "external-dns-sa" (eq $cloud "gcp") | quote }}
            annotations:
{{ if eq $cloud "gcp" }}
              iam.gke.io/gcp-service-account: {{ required "external_dns_service_account_email is required for GCP external-dns" (index $infraServices "external_dns_service_account_email") | quote }}
{{ else }}
              eks.amazonaws.com/role-arn: arn:aws:iam::{{ index .Values "infra-services" "aws_account_id" }}:role/{{ index .Values "infra-services" "eks_cluster_name" }}-external-dns    
{{ end }}
          txtOwnerId: {{ index .Values "infra-services" "environment" }}-{{ index .Values "infra-services" "region" }}-{{ ternary (index $infraServices "dns_managed_zone") (index $infraServices "dns_hosted_zone") (eq $cloud "gcp") }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
{{- end }}
