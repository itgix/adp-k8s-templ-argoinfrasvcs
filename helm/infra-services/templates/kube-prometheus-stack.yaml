{{- if index .Values "infra-services" "enable_prometheus_stack" }}
{{- $infraServices := index .Values "infra-services" }}
{{- $cloud := default "aws" (index $infraServices "cloud") }}
{{- $dnsDomain := ternary (index $infraServices "dns_private_zone") (index $infraServices "dns_main_domain") (eq $cloud "azure") }}
{{- $grafanaIngressHost := index $infraServices "grafana_ingress_host" | default (printf "grafana.%s" $dnsDomain) }}
{{- $alertmanagerIngressHost := index $infraServices "alertmanager_ingress_host" | default (printf "alertmanager-%s.%s" (index $infraServices "region") $dnsDomain) }}
{{- $prometheusIngressHost := index $infraServices "prometheus_ingress_host" | default (printf "prometheus-%s.%s" (index $infraServices "region") $dnsDomain) }}
{{- $monitoringIngressPath := ternary "/" "/*" (eq $cloud "gcp") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  # annotations:
  #   argocd.argoproj.io/sync-wave: "1"
  # Add this finalizer ONLY if you want these to cascade delete.
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: {{ index .Values "infra-services" "gitops_destination_repo" }}
    targetRevision:  {{ default "HEAD" (index .Values "infra-services" "prometheus_stack_branch") }}
    path: helm/kube-prometheus-stack
    helm:
      valueFiles:
        - ../kube-prometheus-stack/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/values.yaml
        - ../infra-services/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/infra-facts.yaml
      values: |
        kube-prometheus-stack:
          grafana:
            plugins:
              - flant-statusmap-panel
              - grafana-clock-panel
{{- if eq $cloud "azure" }}
              - grafana-lokiexplore-app
{{- end }}
            imageRenderer:
              enabled: false
{{- if eq $cloud "azure" }}
            persistence:
              enabled: false
{{- end }}
            sidecar:
              dashboards:
                provider:
                  name: dashboardsProvider
                  allowUiUpdates: true
                  disableDelete: true
              users:
                viewers_can_edit: true
              auth:
                disable_login_form: false
                oauth_auto_login: false
                datasources:
                  enabled: false
                resources:
                  limits:
                    cpu: 200m
                    memory: 156Mi
                  requests:
                    cpu: 50m
                    memory: 100Mi
            ingress:
              enabled: true
              ingressClassName: {{ include "infra-services.ingressClassName" (dict "infraServices" $infraServices "app" "grafana") }}
              annotations:
{{ include "infra-services.ingressAnnotations" (dict "infraServices" $infraServices "app" "grafana" "host" $grafanaIngressHost "managedCertificateName" "grafana" "frontendConfigName" "grafana") | nindent 16 }}
              hosts:
                - {{ $grafanaIngressHost }}
              path: /
              port: 80
{{- if eq $cloud "azure" }}
              tls:
                - secretName: grafana-tls
                  hosts:
                    - {{ $grafanaIngressHost }}
{{- end }}
          defaultRules:
            rules:
              kubeScheduler: false
              kubeSchedulerAlerting: false
              kubeSchedulerRecording: false
              kubeControllerManager: false
          kubeProxy:
            enabled: true
            service:
              enabled: true
              selector:
                component: "kube-proxy"
          kubeControllerManager:
            enabled: false
            service:
              enabled: false
            serviceMonitor:
              enabled: false
          kubeScheduler:
            enabled: false
            service:
              enabled: false
            serviceMonitor:
              enabled: false
          prometheus:
            tls:
              enabled: false
            prometheusSpec:        
              scrapeInterval: 1m
              walCompression: true
{{- if eq $cloud "azure" }}
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 50Gi
              retention: 60d
{{- end }}
              serviceMonitorNamespaceSelector: {}
              serviceMonitorSelector: {}
              serviceMonitorSelectorNilUsesHelmValues: false
          prometheusOperator:
            admissionWebhooks:
              patch:
                enabled: true 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  ignoreDifferences:
  - group: apps
    jsonPointers:
    - /spec/template
    kind: DaemonSet
  - group: apps
    jsonPointers:
    - /spec/template
    kind: Deployment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
  revisionHistoryLimit: 3
{{- end }}
