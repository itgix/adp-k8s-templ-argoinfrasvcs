{{- if index .Values "infra-services" "enable_falco" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  # annotations:
  #   argocd.argoproj.io/sync-wave: "1"
  # Add this finalizer ONLY if you want these to cascade delete.
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: {{ index .Values "infra-services" "gitops_destination_repo" }}
    targetRevision:  {{ default "HEAD" (index .Values "infra-services" "falco_branch") }}
    path: helm/falco
    helm:
      valueFiles:
        - ../falco/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/values.yaml
        - ../infra-services/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/infra-facts.yaml
      values: |
        falco:
          serviceMonitor:
            create: {{ index .Values "infra-services" "enable_prometheus_stack" | default false }}
          falcosidekick:
            serviceMonitor:
              enabled: {{ index .Values "infra-services" "enable_prometheus_stack" | default false }}
            prometheusRules:
              enabled: {{ index .Values "infra-services" "enable_prometheus_stack" | default false }}
          grafana:
            dashboards:
              enabled: {{ index .Values "infra-services" "enable_prometheus_stack" | default false }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 3
{{- end }}
