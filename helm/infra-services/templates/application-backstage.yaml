{{- if index .Values "infra-services" "backstage_enabled" }}
{{- $infraServices := index .Values "infra-services" }}
{{- $cloud := default "aws" (index $infraServices "cloud") }}
{{- $backstageIngressHost := index $infraServices "backstage_ingress_host" | default (printf "%s-%s-backstage-%s.%s" (index $infraServices "project_name") (index $infraServices "region") (index $infraServices "environment") (index $infraServices "dns_main_domain")) }}
{{- $backstageImageRegistry := index $infraServices "backstage_image_registry" }}
{{- if not $backstageImageRegistry }}
{{- if eq $cloud "gcp" }}
{{- $artifactRegistryUrls := default dict (index $infraServices "artifact_registry_repository_urls") }}
{{- $backstageImageRegistry = required "infra-services.backstage_image_registry or artifact_registry_repository_urls.platform is required for Backstage on GCP" (index $artifactRegistryUrls "platform") }}
{{- else }}
{{- $backstageImageRegistry = "709825985650.dkr.ecr.us-east-1.amazonaws.com" }}
{{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: {{ index .Values "infra-services" "gitops_destination_repo" }}
    targetRevision:  {{ default (default "HEAD" (index .Values "infra-services" "gitops_destination_repo_branch")) (index .Values "infra-services" "backstage_branch") }}
    path: helm/backstage
    helm:
      valueFiles:
        - values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/values.yaml
        - ../infra-services/values/{{ index .Values "infra-services" "environment" }}/{{ index .Values "infra-services" "region" }}/infra-facts.yaml
      values: |
        backstage:
          backstage:
            image:
              registry: {{ $backstageImageRegistry }}
              repository: {{ index $infraServices "backstage_image_repository" | default "itgix/itgix-adp-backstage" }}
              tag: {{ index $infraServices "backstage_image_tag" | default "v1.2.7" }}
            extraEnvVars:
              - name: CLOUD_REGION
                value: {{ index $infraServices "region" | quote }}
              - name: APP_BASE_URL
                value: https://{{ $backstageIngressHost }}
              - name: BACKEND_BASE_URL
                value: https://{{ $backstageIngressHost }}

{{- $repoUrl := index .Values "infra-services" "applications_destination_repo" }}
{{- if and $repoUrl (or (contains "github.com" $repoUrl) (contains "gitlab." $repoUrl)) }}
{{- $host := regexReplaceAll "^https?://([^/]+)/.*" $repoUrl "$1" }}
{{- $clean := regexReplaceAll "^https?://[^/]+/|\\.git$" $repoUrl "" }}
{{- $parts := splitList "/" $clean }}
{{- if ge (len $parts) 2 }}
{{- $repo := index $parts (sub (len $parts) 1) }}
{{- $owner := join "/" (slice $parts 0 (sub (len $parts) 1)) }}
              - name: GIT_APP_HOST
                value: {{ $host | quote }}
              - name: GIT_APP_OWNER
                value: {{ $owner | quote }}
              - name: GIT_APP_REPO
                value: {{ $repo | quote }}
{{- end }}
{{- end }}

            extraEnvVarsSecrets:
              - backstage-secrets
{{- if index .Values "infra-services" "enable_guest_login" }}
            appConfig:
              auth:
                providers:
                  guest:
                    dangerouslyAllowOutsideDevelopment: true
{{- end }}
          ingress:
            enabled: true
            className: {{ include "infra-services.ingressClassName" (dict "infraServices" $infraServices "app" "backstage") }}
            host: {{ $backstageIngressHost }}
            annotations:
{{ include "infra-services.ingressAnnotations" (dict "infraServices" $infraServices "app" "backstage" "host" $backstageIngressHost "managedCertificateName" "backstage" "frontendConfigName" "backstage") | nindent 14 }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
{{- end }}
