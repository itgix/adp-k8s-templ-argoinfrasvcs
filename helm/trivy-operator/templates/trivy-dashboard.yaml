{{- /*
  Trivy Operator Grafana dashboard, shipped as a data file.
  The file is read with .Files.Get, so Helm does not interpret its {{namespace}} legends.
*/ -}}
{{ if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trivy-operator.json: |-
{{ .Files.Get "dashboards/trivy-operator.json" | indent 4 }}
{{ end }}
