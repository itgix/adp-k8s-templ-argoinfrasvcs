# ============================================================
# Ingress configuration
# ============================================================

annotations:
  kubernetes.io/ingress.class: alb
  alb.ingress.kubernetes.io/ssl-redirect: "443"
  alb.ingress.kubernetes.io/group.name: mcp-servers
  alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
  alb.ingress.kubernetes.io/ssl-redirect: '443'
  alb.ingress.kubernetes.io/scheme: internet-facing
  alb.ingress.kubernetes.io/target-type: ip
  alb.ingress.kubernetes.io/success-codes: "200-404"
  alb.ingress.kubernetes.io/healthcheck-path: / # or /status

ingressClassName: alb

# Each backend maps a host to an MCP server service
backends:
  loki:
    enabled: false
    host: ""
    path: /
    serviceName: loki-mcp-server
    servicePort: 80
  prometheus:
    enabled: false
    host: ""
    path: /
    serviceName: prometheus-mcp-server
    servicePort: 80
  kubernetes:
    enabled: true
    host: ""
    path: /
    serviceName: kubernetes-mcp-server
    servicePort: 80
  grafana:
    enabled: false
    host: ""
    path: /
    serviceName: grafana-mcp-server
    servicePort: 80
  tempo:
    enabled: false
    host: ""
    path: /
    serviceName: tempo-distributed-query-frontend
    servicePort: 3200

# ============================================================
# MCP server deployments
# ============================================================

# There is no built image for Loki MCP on the internet.
# You can build the image from the Dockerfile in this repo: https://github.com/grafana/loki-mcp and push it to your registry.
lokiMcp:
  enabled: false
  replicas: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: Always
  # In-cluster URL of the Loki read/query endpoint, including scheme and port.
  # Point at the Loki gateway if deployed, otherwise the query-frontend.
  # Example: "http://loki-gateway.monitoring.svc.cluster.local:80"
  lokiUrl: ""
  imagePullSecrets: []
  resources: {}

prometheusMcp:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/pab1it0/prometheus-mcp-server
    tag: latest
    pullPolicy: Always
  # URL of the Prometheus HTTP API, including scheme and port. The MCP server
  # appends /api/v1/* itself, so give the base URL with no trailing path.
  # In-cluster example: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  # An external Prometheus (e.g. "https://prometheus.example.com") also works,
  # but must be reachable from the cluster and may need its own auth.
  prometheusUrl: ""
  resources: {}

kubernetesMcp:
  enabled: false
  replicas: 1
  image:
    repository: quay.io/containers/kubernetes_mcp_server
    tag: latest
    pullPolicy: Always
  logLevel: 4
  resources: {}

  # RBAC rules for the kubernetes-mcp-readonly ClusterRole.
  rbac:
    rules:
      - apiGroups: [""]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["batch"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["policy"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["metrics.k8s.io"]
        resources: ["*"]
        verbs: ["get", "list"]
      - apiGroups: ["autoscaling"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["admissionregistration.k8s.io"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

grafanaMcp:
  # Enable once the service account token is available in the cluster.
  enabled: false
  replicas: 1
  image:
    repository: grafana/mcp-grafana
    tag: latest
    pullPolicy: Always
  # Base URL of the Grafana HTTP API, including scheme and port, with no
  # trailing path. Must match the host the service account token was issued
  # for, and must be reachable from the cluster.
  # In-cluster example: "http://kube-prometheus-stack-grafana.monitoring.svc:80"
  grafanaUrl: ""
  # Grafana service account token — the K8s Secret name and key that the Deployment mounts.
  serviceAccountToken:
    secretName: ""
    secretKey: ""
  imagePullSecrets: []
  resources: {}

# ============================================================
# AIOps agent external secrets
# ============================================================

externalSecrets:
  secretStoreName: secretstore-aws
  secretStoreKind: ClusterSecretStore
  websocketConfig:
    # AWS Secrets Manager key for the agent websocket config
    remoteKey: ""
  gitlabToken:
    # AWS Secrets Manager key for the GitLab registry pull secret
    remoteKey: ""
  vectorSecret:
    # AWS Secrets Manager key for the vector basic-auth credentials
    remoteKey: ""
  grafanaServiceAccountToken:
    # AWS Secrets Manager key for the Grafana service account token
    remoteKey: ""
    # Optional JSON property inside the remote secret. Leave empty if the remote secret value is the raw token
    remoteProperty: ""


# ============================================================
# AIOps Vector
# ============================================================

alertmanagerconfig:
  receiverUrl: https://vector.itgix.com/api/v1/ingester/prometheus-rule


