{{- if .Values.kubernetesMcp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops-platform.kubernetesMcp.configMapName" . }}
  labels:
    app: kubernetes-mcp-server
data:
  config.toml: |
    port = "8080"
    read_only = true
    log_level = {{ .Values.kubernetesMcp.logLevel | default 4 }}
    stateless = true
{{- end }}