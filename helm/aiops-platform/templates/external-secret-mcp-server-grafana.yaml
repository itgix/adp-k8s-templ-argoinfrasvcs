{{- if .Values.grafanaMcp.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafanaMcp.serviceAccountToken.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana-mcp-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.grafanaMcp.serviceAccountToken.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.grafanaMcp.serviceAccountToken.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.grafanaServiceAccountToken.remoteKey | quote }}
        {{- with .Values.externalSecrets.grafanaServiceAccountToken.remoteProperty }}
        property: {{ . }}
        {{- end }}
{{- end }}
