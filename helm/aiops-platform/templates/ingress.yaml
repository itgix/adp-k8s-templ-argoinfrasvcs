{{- range $name, $backend := .Values.backends }}
{{- if $backend.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcp-{{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: mcp-ingress
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ $backend.host | quote }}
    {{- with $.Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $.Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $backend.host | quote }}
      http:
        paths:
          - path: {{ $backend.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backend.serviceName }}
                port:
                  number: {{ $backend.servicePort }}
{{- end }}
{{- end }}