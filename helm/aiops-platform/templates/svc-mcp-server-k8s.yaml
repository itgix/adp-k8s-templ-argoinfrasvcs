{{- if .Values.kubernetesMcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  labels:
    app: kubernetes-mcp-server
spec:
  type: ClusterIP
  selector:
    app: kubernetes-mcp-server
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
{{- end }}