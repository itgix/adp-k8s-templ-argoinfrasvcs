{{- if .Values.defaultAcmeIssuer.enabled }}
{{- if not .Values.defaultAcmeIssuer.email }}
{{- fail "defaultAcmeIssuer.email is required when defaultAcmeIssuer.enabled=true" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.defaultAcmeIssuer.name }}
spec:
  acme:
    email: {{ .Values.defaultAcmeIssuer.email | quote }}
    server: {{ .Values.defaultAcmeIssuer.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.defaultAcmeIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.defaultAcmeIssuer.ingressClassName | quote }}
{{- end }}
