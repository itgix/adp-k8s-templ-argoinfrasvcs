{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-dns-sa-key
  namespace: {{ .Values.externalSecret.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secretstore-stackit
    kind: ClusterSecretStore
  target:
    name: external-dns-sa-key
    creationPolicy: Owner
  data:
    - secretKey: sa.json
      remoteRef:
        key: {{ .Values.externalSecret.saKeySecretName }}
        property: value
{{- end }}
