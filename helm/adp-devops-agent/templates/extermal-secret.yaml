{{- $prefix := printf "%s-%s-%s" (index .Values "infra-services" "region_short") (index .Values "infra-services" "environment") (index .Values "infra-services" "project_name") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: adp-devops-agent-env
  labels:
    app: {{ .Release.Name }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore

  target:
    name: adp-devops-agent-env
    creationPolicy: Owner
  data:
  {{- range .Values.secretEnv }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $prefix }}-{{ .secretManagerName }}
  {{- end }}
