{{- $prefix := printf "%s-%s-%s" (index .Values "infra-services" "region_short") (index .Values "infra-services" "environment") (index .Values "infra-services" "project_name") }}
{{- $groups := dict }}
{{- range .Values.secretEnv }}
{{- $entries := get $groups .secretName | default list }}
{{- $_ := set $groups .secretName (append $entries .) }}
{{- end }}
{{- range $name, $entries := $groups }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    app: {{ $.Release.Name }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore

  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
  {{- range $entries }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $prefix }}-{{ .secretManagerName }}
  {{- end }}
{{- end }}
