# Lets ESO copy the generated client secrets into the SSO consumer namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-secret-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secret-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["keycloak-client-argocd", "keycloak-client-grafana"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secret-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-secret-reader
subjects:
  - kind: ServiceAccount
    name: keycloak-secret-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: secretstore-keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  conditions:
    - namespaces: ["argocd", "monitoring"]   # only SSO consumers may read
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: keycloak-secret-reader
          namespace: {{ .Release.Namespace }}
