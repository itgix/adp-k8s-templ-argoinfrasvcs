# Copies of the generated client secrets for the apps that log in through Keycloak.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-oidc-keycloak
  namespace: argocd
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secretstore-keycloak
  target:
    name: argocd-oidc-keycloak
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd   # ArgoCD only resolves $secret:key from secrets with this label
  data:
    - secretKey: clientSecret
      remoteRef:
        key: keycloak-client-argocd
        property: password
{{- if .Values.hosts.grafana }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc-keycloak
  namespace: monitoring
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: secretstore-keycloak
  target:
    name: grafana-oidc-keycloak
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: keycloak-client-grafana
        property: password
{{- end }}
