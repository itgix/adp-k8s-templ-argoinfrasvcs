{{- $prefix := printf "%s-%s-%s" (index .Values "infra-services" "region_short") (index .Values "infra-services" "environment") (index .Values "infra-services" "project_name") }}
{{- $cloud := default "aws" (index .Values "infra-services" "cloud") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-postgresql
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ ternary "secretstore-gcp" "secretstore-aws" (eq $cloud "gcp") }}
    kind: ClusterSecretStore
  target:
    name: backstage-postgresql
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ $prefix }}-backstage-postgres-password
    - secretKey: postgres-password
      remoteRef:
        key: {{ $prefix }}-backstage-postgres-password
