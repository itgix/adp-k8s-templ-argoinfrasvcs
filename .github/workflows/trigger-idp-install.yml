name: Trigger IDP Install Pipeline

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destroy the environment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      tag:
        description: 'Tag/branch to target (defaults to the current ref)'
        required: false
        type: string

jobs:
  trigger-idp:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitLab idp-installer pipeline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            DESTROY="false"
            PLAN_ONLY="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.tag || github.ref_name }}"
            DESTROY="${{ inputs.destroy }}"
            PLAN_ONLY="false"
          else
            BRANCH="${{ github.ref_name }}"
            DESTROY="false"
            PLAN_ONLY="false"
          fi

          curl -s -X POST \
            --form token="${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            --form ref=develop \
            --form "variables[TEMPLATE_BRANCH]=$BRANCH" \
            --form "variables[TEMPLATE_REPO]=gitops" \
            --form "variables[TEMPLATE_REPO_NAME]=${{ github.event.repository.name }}" \
            --form "variables[MR_AUTHOR]=${{ github.event.pull_request.user.login || github.actor }}" \
            --form "variables[MR_URL]=${{ github.event.pull_request.html_url }}" \
            --form "variables[DESTROY]=$DESTROY" \
            --form "variables[PLAN_ONLY]=$PLAN_ONLY" \
            "https://gitlab.itgix.com/api/v4/projects/${{ secrets.IDP_INSTALLER_PROJECT_ID }}/trigger/pipeline"
